# T0 of the phyphox test strategy: JVM unit tests. The conformance corpus comes from the sibling
# phyphox-docs checkout and is mandatory in CI; the tests skip it only on plain local clones.
name: tests
on: [push, pull_request]

# A new push supersedes the previous run; not on master, whose runs are the record of a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  t0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: phyphox-android
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: phyphox/phyphox-docs
          path: phyphox-docs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Unit tests
        run: cd phyphox-android && ./gradlew testRegularDebugUnitTest

  # The remote web interface (the phyphox-webinterface submodule) in a headless browser against
  # its mock server: no phone involved, so it runs at T0. The same suite runs against the app in t1.yml.
  webinterface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: phyphox-android
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # phyphox-test: webinterface-graphs-t0
      - name: Web interface tests against the mock server
        run: cd phyphox-android/app/src/main/assets/remote/test && npm ci && npm test
