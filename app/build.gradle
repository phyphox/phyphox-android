apply plugin: 'com.android.application'

android {

    defaultConfig {
        applicationId "de.rwth_aachen.phyphox"
        minSdkVersion 21
        targetSdkVersion 37
        compileSdk 37

        versionName "1.2.1"
        //  format  WXXYYZZ, where WW is major, XX is minor, YY is patch, and ZZ is build
        versionCode 1020105 //1.02.01-05

        def locales = ['en', 'cs', 'de', 'el', 'es', 'fr', 'gu', 'hi', 'it', 'ja', 'ka', 'ko', 'nl', 'pl', 'pt', 'ru', 'sr', 'b+sr+Latn', 'ta', 'tr', 'vi', 'zh-rCN', 'zh-rTW']
        buildConfigField "String[]", "LOCALE_ARRAY", "new String[]{\""+locales.join("\",\"")+"\"}"
        resourceConfigurations += locales

        vectorDrawables {
            useSupportLibrary = true
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        multiDexEnabled true

        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            lintOptions {
                disable 'MissingTranslation'
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    //Single flavor: regularDebug/regularRelease are baked into CI, F-Droid's recipe and tools/store_screenshots.py
    flavorDimensions = ["permissions"]
    productFlavors {
        regular {
            dimension "permissions"
        }
    }

    compileOptions {
        encoding = 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    namespace 'de.rwth_aachen.phyphox'
    testNamespace 'de.rwth_aachen.phyphoxTest'

    bundle {
        language {
            enableSplit = false
        }
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        //The phyphox-docs fixture directories each carry a README.md, which would collide in the flat merge
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!README.md'
    }

    sourceSets {
        androidTest {
            //Fixtures come from the sibling phyphox-docs checkout; without it the fixture tests skip
            def fixtures = file("$rootDir/../phyphox-docs/fixtures/views")
            if (fixtures.isDirectory())
                assets.srcDirs += fixtures
            def networkFixtures = file("$rootDir/../phyphox-docs/fixtures/network")
            if (networkFixtures.isDirectory())
                assets.srcDirs += networkFixtures
            def containerFixtures = file("$rootDir/../phyphox-docs/fixtures/containers")
            if (containerFixtures.isDirectory())
                assets.srcDirs += containerFixtures
            //Graph goldens are compared on the device, so they travel with the test APK
            assets.srcDirs += file("src/androidTest/goldens")
        }
    }

    testOptions {
        //Static initializers call android.util.Log (e.g. Analysis)
        unitTests.returnDefaultValues = true
        //The corpus tests parse through the real loading path under Robolectric
        unitTests.includeAndroidResources = true

        //Failure messages carry measurements; Gradle's default format drops them
        unitTests.all {
            testLogging {
                exceptionFormat = 'full'
                showExceptions = true
                showCauses = true
                showStackTraces = true
            }
        }
    }

    ndkVersion '28.0.13004108'
}

//The corpus lives outside the project: declare it as an input or the test task stays up to date after a corpus update
tasks.withType(Test).configureEach {
    //Golden images are recorded rather than compared when asked for explicitly:
    //  ./gradlew testRegularDebugUnitTest -Pphyphox.goldens=record
    if (project.hasProperty("phyphox.goldens"))
        systemProperty "phyphox.goldens", project.property("phyphox.goldens")

    def corpus = file("$rootDir/../phyphox-docs/corpus")
    if (corpus.isDirectory())
        inputs.dir(corpus).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName("phyphoxDocsCorpus")

    def containerFixtures = file("$rootDir/../phyphox-docs/fixtures/containers")
    if (containerFixtures.isDirectory())
        inputs.dir(containerFixtures).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName("phyphoxDocsContainerFixtures")
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'com.google.android.material:material:1.13.0' //1.14.0+ requires minSDK>=23
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.appcompat:appcompat-resources:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.core:core:1.17.0' //1.18.0+ requires minSDK>=23
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'

    implementation 'androidx.viewpager:viewpager:1.1.0'
    implementation 'org.apache.commons:commons-io:1.3.2'

    //https://github.com/journeyapps/zxing-android-embedded/blob/master/CHANGES.md
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    implementation 'net.freeutils:jlhttp:3.2'

    //https://bigbadaboom.github.io/androidsvg/release_notes.html
    implementation 'com.caverock:androidsvg:1.4'

    implementation 'androidx.recyclerview:recyclerview-selection:1.2.0'
    testImplementation 'junit:junit:4.13.2'

    //Instrumentation tests (test matrix tier T1)
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-accessibility:3.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'

    testImplementation "com.google.truth:truth:1.4.5"
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.7.0'


    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0' //Used by the Bluetooth engine (also pulled in transitively by camera/lifecycle libraries)
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'

    def camerax_version = "1.4.2" //1.5.0+ requires minSDK>=23
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    implementation 'androidx.recyclerview:recyclerview:1.4.0'

}
