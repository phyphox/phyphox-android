apply plugin: 'com.android.application'

android {

    defaultConfig {
        applicationId "de.rwth_aachen.phyphox"
        minSdkVersion 21
        targetSdkVersion 37
        compileSdk 37

        versionName "1.2.1-beta4"
        //  format  WXXYYZZ, where WW is major, XX is minor, YY is patch, and ZZ is build
        versionCode 1020104 //1.02.01-04

        // Note that the following locales have not yet been released and are currently included for testing: bn, gu, kn, or
        def locales = ['en', 'bn', 'cs', 'de', 'el', 'es', 'fr', 'gu', 'hi', 'it', 'ja', 'ka', 'ko', 'kn', 'nl', 'or', 'pl', 'pt', 'ru', 'sr', 'b+sr+Latn', 'ta', 'tr', 'vi', 'zh-rCN', 'zh-rTW']
        buildConfigField "String[]", "LOCALE_ARRAY", "new String[]{\""+locales.join("\",\"")+"\"}"
        resourceConfigurations += locales

        vectorDrawables {
            useSupportLibrary = true
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        multiDexEnabled true

        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            lintOptions {
                disable 'MissingTranslation'
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    flavorDimensions = ["permissions"]
    productFlavors {
        screenshot {
            dimension "permissions"
        }
        regular {
            dimension "permissions"
        }
    }

    compileOptions {
        encoding = 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    namespace 'de.rwth_aachen.phyphox'
    testNamespace 'de.rwth_aachen.phyphoxTest'

    bundle {
        language {
            enableSplit = false
        }
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        //Assets from several source directories are merged flat, and both phyphox-docs fixture
        //directories carry a README.md - which would collide. Nothing reads them on the device.
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!README.md'
    }

    sourceSets {
        androidTest {
            //The view fixtures are served straight out of the phyphox-docs checkout next to this
            //repository - the same sibling convention the corpus tests use - so they cannot drift
            //from the shared set. A plain clone without the sibling simply has no fixture assets
            //and the fixture tests skip themselves.
            def fixtures = file("$rootDir/../phyphox-docs/fixtures/views")
            if (fixtures.isDirectory())
                assets.srcDirs += fixtures
            //The network fixtures come along for the chrome suites: opening one is what brings
            //up the network privacy notice.
            def networkFixtures = file("$rootDir/../phyphox-docs/fixtures/network")
            if (networkFixtures.isDirectory())
                assets.srcDirs += networkFixtures
            //And the container archives, which the save-to-collection suite opens the way a file
            //manager hands one over.
            def containerFixtures = file("$rootDir/../phyphox-docs/fixtures/containers")
            if (containerFixtures.isDirectory())
                assets.srcDirs += containerFixtures
            //The graph goldens travel with the test APK: they are compared on the device, where
            //the graphs are rendered (see GraphSnapshotTest for how they are recorded).
            assets.srcDirs += file("src/androidTest/goldens")
        }
    }

    testOptions {
        //JVM unit tests touch classes whose static initializers call android.util.Log
        //(e.g. Analysis); let those calls return defaults instead of throwing
        unitTests.returnDefaultValues = true
        //The corpus conformance tests parse experiment files through the real loading path
        //under Robolectric, which needs the app's resources and assets
        unitTests.includeAndroidResources = true

        //Print the assertion MESSAGE of a failing test, not just its class and line. Several
        //of these tests measure something and put the measurement in the message - the data
        //lock test says how many milliseconds the response took and asks for a bigger buffer
        //if that was too few - and by default Gradle logs "java.lang.AssertionError at
        //RemoteServerGetTest.java:183" and drops the number, which is the one thing needed to
        //act on it. Cost a CI failure on 2026-08-28 that could not be sized afterwards.
        unitTests.all {
            testLogging {
                exceptionFormat = 'full'
                showExceptions = true
                showCauses = true
                showStackTraces = true
            }
        }
    }

    ndkVersion '28.0.13004108'
}

//The conformance corpus and the analysis golden vectors live in a phyphox-docs checkout next to
//this repository, so Gradle cannot see them change: after a corpus update the unit test task
//reports itself up to date and quietly does not re-run. Declaring the directory as an input
//fixes that. CI checks the sibling out fresh every time and is unaffected either way.
tasks.withType(Test).configureEach {
    //Golden images are recorded rather than compared when asked for explicitly:
    //  ./gradlew testRegularDebugUnitTest -Pphyphox.goldens=record
    if (project.hasProperty("phyphox.goldens"))
        systemProperty "phyphox.goldens", project.property("phyphox.goldens")

    def corpus = file("$rootDir/../phyphox-docs/corpus")
    if (corpus.isDirectory())
        inputs.dir(corpus).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName("phyphoxDocsCorpus")

    //Same for the container fixtures, which the intake test reads straight out of the checkout.
    def containerFixtures = file("$rootDir/../phyphox-docs/fixtures/containers")
    if (containerFixtures.isDirectory())
        inputs.dir(containerFixtures).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName("phyphoxDocsContainerFixtures")
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'com.google.android.material:material:1.13.0' //1.14.0+ requires minSDK>=23
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.appcompat:appcompat-resources:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.core:core:1.17.0' //1.18.0+ requires minSDK>=23
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'

    implementation 'androidx.viewpager:viewpager:1.1.0'
    implementation 'org.apache.commons:commons-io:1.3.2'

    //https://github.com/journeyapps/zxing-android-embedded/blob/master/CHANGES.md
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    implementation 'net.freeutils:jlhttp:3.2'

    //https://bigbadaboom.github.io/androidsvg/release_notes.html
    implementation 'com.caverock:androidsvg:1.4'

    implementation 'androidx.recyclerview:recyclerview-selection:1.2.0'
    testImplementation 'junit:junit:4.13.2'

    //Automated screenshot generation
    //Instrumentation tests of the regular flavor: the view behavior, chrome and accessibility
    //suites (test matrix, tier T1). The screenshot flavor keeps its own set below.
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-accessibility:3.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'

    androidTestScreenshotImplementation 'junit:junit:4.13.2'
    androidTestScreenshotImplementation 'tools.fastlane:screengrab:2.1.1'
    androidTestScreenshotImplementation 'androidx.test:rules:1.7.0'
    androidTestScreenshotImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestScreenshotImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    testImplementation "com.google.truth:truth:1.4.5"
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.7.0'

    //MQTT is handled by a from-scratch MQTT 3.1.1 client (NetworkConnection/Mqtt/MqttClient.java);
    //the Eclipse Paho / hannesa2 "paho.mqtt.android" fork dependency was removed.

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0' //Used by the Bluetooth engine (also pulled in transitively by camera/lifecycle libraries)
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'

    def camerax_version = "1.4.2" //1.5.0+ requires minSDK>=23
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    implementation 'androidx.recyclerview:recyclerview:1.4.0'

}
